[tool.pytest.ini_options]
testpaths = [
    "bench/tests/unit", "bench/tests/api",
    "bench/tests/test_proxy_success_detection.py",
    "bench/tests/test_capture_tool_results.py",
    "bench/tests/test_anthropic_runner.py",
    "bench/tests/test_runner_crash_recovery.py",
    "bench/tests/test_trial_budget.py",
    "bench/tests/test_tool_jobs.py",
    "bench/tests/test_run_control_token.py",
    "bench/tests/test_run_state_transitions.py",
    "bench/tests/test_rest_transport_jobs.py",
    "bench/tests/test_lean_config.py",
]
pythonpath = ["bench"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket -m 'not live'"
markers = ["live: optional tests that make live model calls"]
timeout = 60
