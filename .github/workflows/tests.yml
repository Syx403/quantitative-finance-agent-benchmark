name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate task catalog
        run: python scripts/check_catalog.py
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check experiment configuration
        run: PYTHONPATH=bench python -m experiments.user_sim_stability.cli dry-run
