<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Look-ahead-bias task: time alignment and evaluation evidence</title><desc id="desc">L1_DBG_01 requires shifting the position by one bar, writing diagnosis.md, lookahead_fixed.py and comparison.json, and running both versions. Saved artifacts feed result-quality checks; tool and conversation records feed process-quality checks. A complete aggregate needs both scoring tracks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1080" rx="18" fill="#f3f8f5"/>
<text x="48" y="52" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="48" dy="0">QUANTITATIVE FINANCE AGENT BENCHMARK / L1_DBG_01</tspan></text>
<text x="48" y="106" fill="#193b32" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" text-anchor="start"><tspan x="48" dy="0">One temporal bug. Two evidence tracks.</tspan></text>
<text x="48" y="145" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">An existing task contract — no new agent run or investment result is claimed.</tspan></text>
<rect x="48" y="180" width="1104" height="78" rx="12" fill="#e3efe8" stroke="#b7cdbf" stroke-width="1.5"/>
<text x="70" y="211" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="70" dy="0">INPUT FIXTURE</tspan></text>
<text x="70" y="242" fill="#193b32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" dy="0">student_code/lookahead.py + data/AAPL_2018_2024.csv</tspan></text>
<text x="48" y="299" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="48" dy="0">WHAT THE AGENT MUST REPAIR</tspan></text>
<rect x="48" y="323" width="530" height="137" rx="12" fill="#fff4f0" stroke="#dcb2a1" stroke-width="1.5"/>
<text x="70" y="359" fill="#8c422c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Before: current-bar information leaks</tspan></text>
<text x="70" y="399" fill="#8c422c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Signal[t]  →  Position[t]</tspan></text>
<text x="70" y="435" fill="#805343" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="70" dy="0">The decision uses the same bar’s closing signal.</tspan></text>
<rect x="602" y="323" width="550" height="137" rx="12" fill="#e6f4ed" stroke="#9bc7b2" stroke-width="1.5"/>
<text x="626" y="359" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="626" dy="0">After: the position uses prior information</tspan></text>
<text x="626" y="399" fill="#17634d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="626" dy="0">Signal[t−1]  →  Position[t]</tspan></text>
<text x="626" y="435" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="626" dy="0">Apply shift(1); then run both versions.</tspan></text>
<path d="M600 479V519" fill="none" stroke="#17634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="265" y="529" width="670" height="82" rx="12" fill="#193b32" stroke="#193b32" stroke-width="1.5"/>
<text x="600" y="564" fill="#b6e3ce" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">AGENT EXECUTION IN THE TASK WORKSPACE</tspan></text>
<text x="600" y="595" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Inspect → explain → patch → run → compare</tspan></text>
<path d="M444 615V639H312V668" fill="none" stroke="#17634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M756 615V639H886V668" fill="none" stroke="#17634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="681" width="530" height="166" rx="12" fill="#fff" stroke="#ccd7e2" stroke-width="1.5"/>
<text x="70" y="718" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="70" dy="0">SAVED ARTIFACTS</tspan></text>
<text x="70" y="756" fill="#193b32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start"><tspan x="70" dy="0">diagnosis.md · lookahead_fixed.py</tspan><tspan x="70" dy="30">comparison.json</tspan></text>
<text x="70" y="821" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Explanation, corrected code, before / after metrics.</tspan></text>
<rect x="602" y="681" width="550" height="166" rx="12" fill="#fff" stroke="#ccd7e2" stroke-width="1.5"/>
<text x="626" y="718" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="626" dy="0">EXECUTION RECORD</tspan></text>
<text x="626" y="758" fill="#193b32" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="626" dy="0">Tool arguments + command output</tspan><tspan x="626" dy="33">Exit status + conversation</tspan></text>
<text x="626" y="821" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="626" dy="0">Evidence of what the agent actually attempted.</tspan></text>
<path d="M312 850V871H886V850" fill="none" stroke="#17634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M312 871V882" fill="none" stroke="#17634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M886 871V882" fill="none" stroke="#17634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="863" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Shared evidence bundle</tspan></text>
<text x="312" y="914" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle"><tspan x="312" dy="0">QR · result quality</tspan></text>
<text x="312" y="947" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="312" dy="0">Artifacts, code, constraints, judgment</tspan></text>
<text x="886" y="914" fill="#17634d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle"><tspan x="886" dy="0">QP · process quality</tspan></text>
<text x="886" y="947" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="886" dy="0">Tool use, execution, problem solving</tspan></text>
<path d="M312 967V981H886V967" fill="none" stroke="#9fb9ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="1016" fill="#193b32" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Full aggregate: 0.60 × QR + 0.40 × QP</tspan></text>
<text x="600" y="1054" fill="#48665b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Missing required score → not computable. Structural checks alone do not prove correctness.</tspan></text>
</svg>
